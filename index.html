<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">修</span> 報修登記<span class="brand-note">REPAIR DESK</span></div>
    <span class="header-note">讓每個問題，都有紀錄。</span>
  </header>

  <main class="page">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">一起維護更好的工作環境</p>
      <h1 id="page-title">發現問題，<br class="mobile-break">從這裡開始。</h1>
      <p>填寫報修資訊，留下問題細節，方便後續安排處理。</p>
    </section>

    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading">
        <div><p class="step-label">01 / 建立紀錄</p><h2 id="form-title">新增報修</h2></div>
        <span class="muted small">所有欄位皆為必填</span>
      </div>
      <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
      <noscript><p class="message" data-kind="error">請啟用 JavaScript，才能送出及查看報修紀錄。</p></noscript>
      <form id="repair-form">
        <fieldset id="form-fields" class="form-fields">
          <legend class="sr-only">報修資料</legend>
          <div class="form-grid">
            <div class="field">
              <label for="requester-name">報修人</label>
              <input id="requester-name" name="requester_name" autocomplete="name" maxlength="100" placeholder="請填寫姓名" required>
            </div>
            <div class="field">
              <label for="location">地點或部門</label>
              <input id="location" name="location" maxlength="200" placeholder="例如：示範辦公室 3 樓" required>
            </div>
            <div class="field">
              <label for="category">類別</label>
              <select id="category" name="category" required>
                <option value="" disabled selected>請選擇問題類別</option>
                <option value="設備">設備</option>
                <option value="網路">網路</option>
                <option value="環境">環境</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <fieldset class="field priority-field">
              <legend>緊急程度</legend>
              <div class="priority-options">
                <label><input type="radio" name="priority" value="低" required><span>低</span></label>
                <label><input type="radio" name="priority" value="中" checked><span>中</span></label>
                <label><input type="radio" name="priority" value="高"><span>高</span></label>
              </div>
            </fieldset>
            <div class="field full-width">
              <label for="description">問題說明</label>
              <textarea id="description" name="description" rows="4" maxlength="5000" placeholder="請描述發生的問題、位置及影響情形…" required></textarea>
            </div>
          </div>
          <div class="form-footer">
            <p class="muted small">請勿填寫密碼或其他敏感資訊。</p>
            <button id="submit-button" type="submit" disabled>送出報修 <span aria-hidden="true">↗</span></button>
          </div>
        </fieldset>
      </form>
    </section>

    <section class="requests-section" aria-labelledby="list-title">
      <div class="section-heading list-heading">
        <div><p class="step-label">02 / 報修紀錄</p><h2 id="list-title">最近報修 <span id="request-count" class="count">0</span></h2></div>
        <button id="refresh-button" class="secondary-button" type="button" disabled>重新整理</button>
      </div>
      <p class="muted list-caption">顯示最近 20 筆，依登記時間由新到舊排列。</p>
      <div id="list-message" class="message" role="status" aria-live="polite" hidden></div>
      <p id="empty-state" class="empty-state">填入連線設定後，即可查看報修紀錄。</p>
      <ol id="request-list" class="request-list" aria-label="最近報修清單" aria-busy="false"></ol>
    </section>
  </main>
  <footer class="site-footer">報修登記 <span aria-hidden="true">·</span> 每一筆紀錄，都是改善的開始。</footer>

  <template id="request-template">
    <li class="request-card">
      <article>
        <div class="request-topline">
          <div class="badges"><span class="category-badge" data-field="category"></span><span class="priority-badge" data-field="priority"></span></div>
          <time data-field="created_at"></time>
        </div>
        <h3 data-field="location"></h3>
        <p class="request-description" data-field="description"></p>
        <p class="request-person">報修人：<span data-field="requester_name"></span></p>
      </article>
    </li>
  </template>
</body>
</html>
